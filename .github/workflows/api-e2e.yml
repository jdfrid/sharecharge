name: ShareCharge API E2E

on:
  workflow_dispatch:
  push:
    paths:
      - 'server/**'
      - 'docker-compose.yml'
      - 'server/scripts/e2e-test.js'

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Start stack
        run: docker compose up --build -d
      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/api/health && exit 0
            sleep 2
          done
          exit 1
      - run: npm run test:e2e
