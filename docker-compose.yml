services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sharecharge
      POSTGRES_PASSWORD: sharecharge
      POSTGRES_DB: sharecharge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharecharge"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://sharecharge:sharecharge@postgres:5432/sharecharge
      JWT_SECRET: dev-jwt-secret-change-in-production
      CORS_ORIGINS: http://localhost:5173,capacitor://localhost,http://localhost
      AUTO_MIGRATE: "true"
      AUTO_SEED: "true"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
