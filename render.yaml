services:
  - type: web
    name: sharecharge-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: sharecharge-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://sharecharge.onrender.com,capacitor://localhost,http://localhost,https://localhost
      - key: AUTO_MIGRATE
        value: "true"
      - key: AUTO_SEED
        value: "true"
      - key: NODE_ENV
        value: production

databases:
  - name: sharecharge-db
    plan: free
    databaseName: sharecharge
    user: sharecharge
