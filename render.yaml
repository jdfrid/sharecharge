services:
  - type: web
    name: sharecharge
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    envVars:
      - key: VITE_SHARECHARGE_DATA_MODE
        value: api
      - key: VITE_SHARECHARGE_APP
        value: all
      - key: VITE_SHARECHARGE_API_URL
        value: https://sharecharge-api.onrender.com

  - type: web
    name: sharecharge-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: sharecharge-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://sharecharge.onrender.com,capacitor://localhost,http://localhost,https://localhost
      - key: AUTO_MIGRATE
        value: "true"
      - key: AUTO_SEED
        value: "true"
      - key: NODE_ENV
        value: production
      - key: ALLOW_DEV_OTP
        value: "true"

databases:
  - name: sharecharge-db
    plan: free
    databaseName: sharecharge
    user: sharecharge
